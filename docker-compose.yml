version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keycloak_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak_pass}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - keycloak_net

  keycloak-init:
    image: python:3.11-alpine
    container_name: keycloak-init
    restart: "no"
    environment:
      KC_URL: http://keycloak:8080
      KC_REALM: app-realm
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/init.py:/init.py:ro
    command: python /init.py
    networks:
      - keycloak_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keycloak-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      KC_URL: http://keycloak:8080
      KC_REALM: app-realm
      KC_CLIENT_ID: app-client
      KC_ISSUER: http://localhost:8080
      KC_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
    ports:
      - "4000:4000"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak_net

networks:
  keycloak_net:
    driver: bridge

volumes:
  postgres_data:
