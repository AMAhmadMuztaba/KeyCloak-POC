services:
  postgres:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keycloak_net

  keycloak:
    # Native Organizations (including the server-side organization picker and
    # the organization JWT claim) is supported in Keycloak 26+.
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm --features=organization
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      # start-dev disables hostname enforcement by design (local prototype only).
      # Do NOT use start-dev in production — switch to `start` and set KC_HOSTNAME
      # to the actual public hostname with KC_HOSTNAME_STRICT: "true".
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes/autom:/opt/keycloak/themes/autom:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 5 cat <&3 | head -1 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks:
      - keycloak_net

  keycloak-init:
    image: python:3.11-alpine
    container_name: keycloak-init
    restart: "no"
    environment:
      KC_URL: http://keycloak:8080
      KC_REALM: ${KC_REALM:-autom-realm}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/init.py:/init.py:ro
    command: python /init.py
    networks:
      - keycloak_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keycloak-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      KC_URL: http://keycloak:8080
      KC_REALM: ${KC_REALM:-autom-realm}
      KC_CLIENT_ID: ${KC_CLIENT_ID:-autom-app}
      KC_ISSUER: http://localhost:8080
      KC_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "4000:4000"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak_net

networks:
  keycloak_net:
    driver: bridge

volumes:
  postgres_data:
