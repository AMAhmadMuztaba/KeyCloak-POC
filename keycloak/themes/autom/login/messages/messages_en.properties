autom.language.label=Language

# Raw error keys set via Java's form.setError(...) rather than msg("autom.*")
# -- these have no autom.* prefix because they're set with the literal key
# string, not looked up through our own namespaced keys. Without an entry
# here Keycloak falls back to printing the raw key text on the page.
automNoOrganizationAccess=You don''t have access to any organisation yet. Ask your admin to add you.
automOrganizationSelectionRequired=Choose an organisation to continue.
automProjectSelectionRequired=Choose a project to continue.

# Keycloak's stock English text for these two prefixes a literal "«"/"»"
# guillemet onto the button label -- overridden to match this theme's plain
# button copy (no decorative punctuation anywhere else in this theme).
backToApplication=Back to application
proceedWithAction=Continue

# Shown before an invite/reset email link's required actions actually start --
# Keycloak's own copy here is a blunt "Perform the following action(s)"
# followed by a stock Title Case list. Overridden with copy matching this
# theme's voice everywhere else.
autom.confirmActions.title=Let''s finish setting up your account
autom.confirmActions.subtitle=Before you continue, you''ll need to:
autom.confirmActions.continue=Get started

# Stock Title Case labels for two of the four possible actions on that
# screen -- our own custom required actions (autom-onboarding-profile,
# autom-optional-totp, further down this file) already use sentence case;
# these two make the other half of the list match.
requiredAction.UPDATE_PASSWORD=Set a password
requiredAction.VERIFY_EMAIL=Verify your email

# Shown for the instant before the auto-redirect script above fires (or if JS
# is blocked) -- e.g. right after finishing profile/password/TOTP setup, or
# clicking an email-verify link.
autom.redirecting.title=Almost done
autom.redirecting.subtitle=We''re finishing setting up your profile. You''ll be redirected automatically — if nothing happens, use the button below.
autom.redirecting.continue=Continue to Autom

# Shown when a step is resubmitted after Keycloak has already moved past it --
# most often the browser Back button during a multi-step login.
autom.pageExpired.title=Your session expired
autom.pageExpired.subtitle=That step is no longer valid — this can happen after using your browser''s back button mid-login. Start over, or try continuing if you were still on the right page.
autom.pageExpired.restart=Start over
autom.pageExpired.continue=Try to continue

# Keycloak deliberately shows this SAME message whether the password was
# actually wrong or the account is under a brute-force lockout -- revealing
# "account is temporarily locked" separately would let an attacker learn an
# account exists and is real just by trying (and failing) a few times. This
# override keeps that same ambiguity but at least hints at the lockout
# possibility, since a person retyping their own correct password a couple of
# times can otherwise look identical to genuinely wrong credentials.
invalidUserMessage=Invalid username or password. If you''ve tried a few times, wait a minute before trying again.

# Keycloak ships this with the SAME default text as invalidUserMessage on
# purpose, so a locked account can't be told apart from a wrong password by
# default (anti-enumeration). This is an internal, staff-only portal rather
# than a public sign-up flow, so that tradeoff isn't worth the confusion it
# caused -- overridden to say plainly what's actually happening.
accountTemporarilyDisabledMessage=Your account is temporarily locked after repeated failed sign-in attempts. Wait a minute, then try again.

requiredAction.autom-onboarding-profile=Complete your profile
requiredAction.autom-optional-totp=Set up two-factor authentication
